name: Update data

on:
  schedule:
    - cron: "15 0 * * *"   # daily, 00:15 UTC, just after the daily candle closes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/; then echo "No changes"; exit 0; fi
          git config user.name "btc-graph-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "data: daily update $(date -u +%F)"
          git push
